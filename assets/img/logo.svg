<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 100" width="100%" height="100%">
  <!-- Fundo escuro elegante combinando com o Dark Mode do Chirpy -->
  <rect width="320" height="100" rx="14" fill="#0b0f19" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Detalhe gráfico lateral (Estilo tag de código ou marcador) -->
  <rect x="18" y="22" width="6" height="56" rx="3" fill="#3b82f6"/>

  <!-- Tipografia Principal: That One Side -->
  <text x="42" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="600" fill="#94a3b8" letter-spacing="1">THAT</text>
  <text x="42" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="900" fill="#f8fafc" letter-spacing="0.5">ONE SIDE</text>

  <!-- Ponto final estilizado de terminal -->
  <circle cx="185" cy="66" r="4" fill="#3b82f6"/>
</svg>
